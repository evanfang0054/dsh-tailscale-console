# dsh-tailscale-console bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package.
# When the plugin is installed with the official CLI —
#
#   dsh plugin --profile <name> add dsh-tailscale-console
#
# — the command reconciles `dsh.profile.bundles` against the installed
# packages and, seeing this `dsh.bundle` declaration, appends
# `dsh-tailscale-console` to the profile's bundle stack. The profile boot
# then merges THIS patch (a single `insert` of the plugin row) exactly like
# the manual cordis.patch.yml mount line used before. No profile file edits
# needed — one command installs and mounts.
#
# Per-user options such as `config.sshAlias` are intentionally NOT here:
# they are machine-specific. Override them from the profile's own
# cordis.patch.yml by targeting the same entry id, e.g.
#
#   - id: tailscale-console
#     config:
#       sshAlias: my-server
#
# If the profile still carries the old manual mount line in its own
# cordis.patch.yml, remove it before switching to the bundle channel to
# avoid double-mounting (two host halves, two panels).
- insert:
    - id: tailscale-console
      name: 'dsh-tailscale-console'
