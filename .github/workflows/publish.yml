name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check lib/index.js
      - run: node --check lib/client.js
      - run: node -e "const p=require('./package.json'); if(!p.name||!p.version||!p.license) process.exit(1); console.log('package.json OK:', p.name, p.version)"

  publish:
    name: 发布到 npm
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: 发布
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
